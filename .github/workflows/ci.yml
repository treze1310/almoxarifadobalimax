name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Mesma versão da máquina de desenvolvimento. Com o Node 22 o cliente
          # do Supabase quebra ao ser criado ("native WebSocket not found"), e
          # o CI falhava em toda execução enquanto os testes passavam local.
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Type-check
        # tsconfig.json tem "files": [] e apenas referencias de projeto, entao
        # "tsc --noEmit" na raiz nao verifica arquivo nenhum. E preciso apontar
        # para o projeto da aplicacao.
        run: pnpm run typecheck

      - name: Lint (falha apenas em erros)
        run: pnpm exec eslint src --max-warnings 200

      - name: Testes
        run: pnpm exec vitest --run

      - name: Build de produção
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
